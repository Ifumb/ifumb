# Version updates only: Dependabot security alerts do not cover pnpm natively yet, which is why
# `pnpm run audit` runs in CI (see .github/workflows/ci.yml).
version: 2
updates:
  - package-ecosystem: 'npm' # detects pnpm-lock.yaml
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
